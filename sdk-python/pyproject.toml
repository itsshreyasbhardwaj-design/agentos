[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-sdk"
version = "0.1.0"
description = "Python client for the AgentOS agent runtime and control plane"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentOS contributors" }]
keywords = ["ai", "agents", "runtime", "llm", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# Deliberately dependency-free: the client uses only the standard library, so it
# adds nothing to a consumer's dependency tree and installs anywhere Python does.
dependencies = []

[project.urls]
Homepage = "https://github.com/itsshreyasbhardwaj-design/agentos"
Source = "https://github.com/itsshreyasbhardwaj-design/agentos"

[tool.setuptools.packages.find]
include = ["agentos*"]
