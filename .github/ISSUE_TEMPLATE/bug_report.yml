name: Bug report
description: Something behaves differently from how it is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, **stop** and report it privately instead —
        see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        Steps, or better, a failing test. The agent spec, the input, and the
        execution id if you have one.
      placeholder: |
        1. Publish an agent with permissions { ... }
        2. Run it with input { ... }
        3. The execution ends `failed` with code `...`
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: Trace or events
      description: >
        Output of `GET /v1/executions/:id/trace`, or the relevant events.
        Values are already redacted server-side, but please check before pasting.
      render: json

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: dropdown
    id: infrastructure
    attributes:
      label: Store and queue
      options:
        - in-memory (single process)
        - PostgreSQL + Redis
        - PostgreSQL + in-memory queue
        - other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node version and platform
      placeholder: "v22.11.0, linux/arm64"
