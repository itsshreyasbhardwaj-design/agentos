name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a test reach a paid provider, whatever is configured.
  AGENTOS_OFFLINE: 'true'

jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One command, the same one a developer runs: every package, both Node
      # apps and the dashboard. It must not need a live control plane or any
      # credential to succeed.
      - run: pnpm build:all
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Unit and security suites need no services: the model is deterministic
      # and the Postgres store runs in-process via PGlite.
      - run: pnpm test:unit
      - run: pnpm test:security
      - run: pnpm test:integration

  redis:
    name: redis queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # This is the job that makes the Redis adapter a verified component
      # rather than an unproven one.
      - run: pnpm test:integration
        env:
          REDIS_URL: redis://127.0.0.1:6379

  python:
    name: python sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests
        working-directory: sdk-python
        run: python -m unittest discover -s tests -v

  python-live:
    name: python sdk (against a live api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the API with demo data
        run: |
          AGENTOS_SEED_DEMO=true PORT=8787 LOG_LEVEL=error \
            node apps/api/dist/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q DEMO_API_KEY /tmp/api.log && break
            sleep 1
          done
          grep -q DEMO_API_KEY /tmp/api.log || { echo "API did not start"; cat /tmp/api.log; exit 1; }
          echo "AGENTOS_API_KEY=$(grep -o 'DEMO_API_KEY=.*' /tmp/api.log | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Live round trip
        working-directory: sdk-python
        run: python -m unittest tests.test_live -v
        env:
          AGENTOS_URL: http://127.0.0.1:8787
      - name: API log
        if: failure()
        run: cat /tmp/api.log

  e2e:
    name: end-to-end (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
